name: Build Android APK (Release & Unsigned)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Debug Keystore for local checks
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore for local dev..."
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Check for Release Keystore Secrets
      - name: Check and Configure Release Keystore
        id: check-secrets
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.STORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ] && \
             ([ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] || [ -n "${{ secrets.KEY_ALIAS }}" ]); then
            echo "Release keystore secrets found. Decoding signing keystore..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "HAS_RELEASE_KEYSTORE=true" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "Release keystore secrets missing or incomplete."
            echo "Will build official unsigned release APK. Debug APK will NOT be released."
            echo "HAS_RELEASE_KEYSTORE=false" >> $GITHUB_ENV
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # Process and Prepare Release Assets
      - name: Package Release Assets
        id: package-assets
        run: |
          mkdir -p release-assets
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release!"
            exit 1
          fi

          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            echo "Processing signed release APK: $RELEASE_APK"
            cp "$RELEASE_APK" release-assets/KasCrypt-release.apk
            echo "Output: release-assets/KasCrypt-release.apk"
          else
            echo "Processing unsigned release APK: $RELEASE_APK"
            cp "$RELEASE_APK" release-assets/KasCrypt-release-unsigned.apk
            # Ensure clean unsigned release APK by stripping signatures if any were inherited
            zip -d release-assets/KasCrypt-release-unsigned.apk "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" "META-INF/MANIFEST.MF" 2>/dev/null || true
            echo "Output: release-assets/KasCrypt-release-unsigned.apk"
          fi

          ls -lh release-assets/

      # Upload Artifact to GitHub Actions Run
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_RELEASE_KEYSTORE == 'true' && 'KasCrypt-release-signed' || 'KasCrypt-release-unsigned' }}
          path: release-assets/*.apk
          retention-days: 90
          if-no-files-found: error

      # Publish ONLY on Release Tags (Never publish Debug APK to Releases)
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'KasCrypt Release' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

