name: Build Android APK (Release & Unsigned)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Check and Verify Release Keystore Secrets
      - name: Check and Configure Release Keystore
        id: check-secrets
        run: |
          rm -f release.keystore
          KEYSTORE_VALID=false
          
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.STORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ] && \
             ([ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] || [ -n "${{ secrets.KEY_ALIAS }}" ]); then
            
            ALIAS="${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}"
            STORE_PASS="${{ secrets.STORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            
            echo "Release keystore secrets detected. Decoding release.keystore..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > release.keystore 2>/dev/null || true
            
            if [ -f "release.keystore" ] && [ -s "release.keystore" ]; then
              echo "Testing keystore password and alias with keytool..."
              if keytool -list -keystore release.keystore -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
                echo "Keystore and alias verified successfully!"
                KEYSTORE_VALID=true
                echo "HAS_RELEASE_KEYSTORE=true" >> $GITHUB_ENV
                echo "ENABLE_RELEASE_SIGNING=true" >> $GITHUB_ENV
                echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
                echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
                echo "RELEASE_KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
                echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
                echo "has_keystore=true" >> $GITHUB_OUTPUT
              else
                echo "WARNING: Keystore verification failed (keystore password or alias in GitHub Secrets does not match the keystore file)."
                echo "Will fall back safely to building and releasing the official unsigned release APK."
                rm -f release.keystore
              fi
            fi
          fi

          if [ "$KEYSTORE_VALID" != "true" ]; then
            echo "No valid release keystore configured or verification failed."
            echo "Building official unsigned release APK. Debug APK will NOT be released."
            echo "HAS_RELEASE_KEYSTORE=false" >> $GITHUB_ENV
            echo "ENABLE_RELEASE_SIGNING=false" >> $GITHUB_ENV
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # Process and Prepare Release Assets
      - name: Package Release Assets
        id: package-assets
        run: |
          mkdir -p release-assets
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release!"
            exit 1
          fi

          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            echo "Processing signed release APK: $RELEASE_APK"
            cp "$RELEASE_APK" release-assets/KasCrypt-release.apk
            echo "Output: release-assets/KasCrypt-release.apk"
          else
            echo "Processing unsigned release APK: $RELEASE_APK"
            cp "$RELEASE_APK" release-assets/KasCrypt-release-unsigned.apk
            # Ensure clean unsigned release APK by stripping signatures if any were inherited
            zip -d release-assets/KasCrypt-release-unsigned.apk "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" "META-INF/MANIFEST.MF" 2>/dev/null || true
            echo "Output: release-assets/KasCrypt-release-unsigned.apk"
          fi

          ls -lh release-assets/

      # Upload Artifact to GitHub Actions Run
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_RELEASE_KEYSTORE == 'true' && 'KasCrypt-release-signed' || 'KasCrypt-release-unsigned' }}
          path: release-assets/*.apk
          retention-days: 90
          if-no-files-found: error

      # Publish to GitHub Release
      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'KasCrypt Latest Release' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

